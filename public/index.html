<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Family Grocery List | Shared Household Notepad</title>
  <meta name="description" content="A simple, fast, shared grocery list for your family. No login, instant realtime sync.">
  <meta name="theme-color" content="#F4EEFF">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- ================= STATE A: ALL LISTS DASHBOARD (FIRST THING USER SEES) ================= -->
  <div id="view-dashboard" class="view-container">
    <div class="dashboard-layout">
      <!-- Dashboard Header -->
      <header class="dashboard-header">
        <div class="brand-wrap">
          <div class="app-icon-mini">
            <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="21" r="1"></circle>
              <circle cx="19" cy="21" r="1"></circle>
              <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"></path>
            </svg>
          </div>
          <div>
            <h1 class="dashboard-title">Shopping Lists</h1>
            <p class="dashboard-sub">Your shared family notepads</p>
          </div>
        </div>

        <button id="btn-header-new-list" class="btn-create-compact" aria-label="Create new list">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span>New List</span>
        </button>
      </header>

      <!-- Quick New List Inline Form (Hidden by default, opens when clicked) -->
      <div id="form-new-list-card" class="new-list-card hidden">
        <form id="form-create-list" class="create-list-form">
          <input type="text" id="input-new-list-title" placeholder="List name (e.g. Weekly Groceries, Costco, Pharmacy)" maxLength="60" autocomplete="off" class="input-new-list" />
          <div class="create-list-buttons">
            <button id="btn-cancel-create" type="button" class="btn-cancel">Cancel</button>
            <button type="submit" class="btn-save">Create</button>
          </div>
        </form>
      </div>

      <!-- Lists Grid / Cards -->
      <main class="dashboard-main">
        <div id="dashboard-lists-container" class="dashboard-lists-grid">
          <div class="loading-hint">Loading your shopping lists...</div>
        </div>
      </main>
    </div>
  </div>

  <!-- ================= STATE B: SHARED GROCERY LIST VIEW ================= -->
  <div id="view-list" class="view-container hidden">
    <div class="list-layout">

      <!-- Header with Back button, Title, Direct Delete, and Share -->
      <header class="list-header">
        <div class="header-left">
          <!-- Back to All Lists Button -->
          <button id="btn-back-to-lists" class="btn-back-lists" aria-label="Back to all shopping lists">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            <span>All Lists</span>
          </button>

          <div id="title-display" class="title-display-wrap">
            <h1 id="list-title" class="list-title" title="Tap to rename">Family Grocery List</h1>
            <button id="btn-edit-title" class="icon-btn" aria-label="Edit list name" title="Rename list">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
              </svg>
            </button>
          </div>

          <div id="title-edit-wrap" class="title-edit-wrap hidden">
            <input type="text" id="input-title-edit" maxLength="100" class="input-title-edit" />
            <button id="btn-save-title" class="btn-save-title">Save</button>
          </div>

          <!-- Google-style People Online Presence Stack -->
          <div class="presence-bar">
            <div id="avatar-stack" class="avatar-stack"></div>
            <span id="presence-label" class="presence-label">1 online</span>
          </div>
        </div>

        <div class="header-right">
          <!-- Direct Delete List Button on the List Header itself -->
          <button id="btn-delete-current-list" class="btn-delete-direct" aria-label="Delete this list" title="Delete list">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>

          <!-- Share Button -->
          <button id="btn-share" class="btn-share" aria-label="Share grocery list">
            <svg id="share-icon" viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="18" cy="5" r="3"></circle>
              <circle cx="6" cy="12" r="3"></circle>
              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
            </svg>
            <span id="share-btn-text">Share</span>
          </button>
        </div>
      </header>

      <!-- Main Grocery Items Sections -->
      <main class="list-main">

        <!-- Empty State -->
        <div id="empty-state" class="empty-state">
          <p class="empty-title">Your grocery list is empty.</p>
          <p class="empty-sub">Type an item you need to buy below.</p>
        </div>

        <!-- Need to Buy Section -->
        <section id="section-active" class="item-section hidden">
          <div class="section-label">
            <span>NEED TO BUY</span>
            <span id="active-count" class="count-badge">0</span>
          </div>
          <div id="active-items" class="item-list"></div>
        </section>

        <!-- Purchased Section -->
        <section id="section-completed" class="item-section hidden">
          <div class="section-label section-label-flex">
            <div class="label-left">
              <span>PURCHASED</span>
              <span id="completed-count" class="count-badge">0</span>
            </div>
            <button id="btn-clear-purchased-inline" class="btn-text-action" type="button">
              Clear Completed
            </button>
          </div>
          <div id="completed-items" class="item-list"></div>
        </section>

      </main>

      <!-- Sticky Bottom Add Item Bar -->
      <footer class="add-bar-sticky">
        <div class="add-bar-inner">
          <div id="qty-row" class="qty-row hidden">
            <input type="text" id="input-item-qty" placeholder="Quantity (e.g. 2 packets, 1 kg)" maxLength="100" class="input-qty" />
            <button id="btn-close-qty" class="btn-close-qty" type="button">Cancel</button>
          </div>

          <form id="form-add-item" class="add-form">
            <div class="input-wrapper">
              <input type="text" id="input-item-name" placeholder="Add item..." maxLength="200" autocomplete="off" class="input-name" />
              <button id="btn-toggle-qty" type="button" class="btn-toggle-qty">+ qty</button>
            </div>

            <button id="btn-add-submit" type="submit" class="btn-add-submit" aria-label="Add grocery item">
              <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </button>
          </form>
        </div>
      </footer>

    </div>
  </div>

  <!-- ================= CONFIRMATION MODAL ================= -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3 id="modal-title" class="modal-title">Delete list?</h3>
      <p id="modal-message" class="modal-message">This will permanently delete this shopping list.</p>
      <div class="modal-actions">
        <button id="btn-modal-cancel" class="btn-modal-cancel">Cancel</button>
        <button id="btn-modal-confirm" class="btn-modal-confirm">Delete</button>
      </div>
    </div>
  </div>

  <!-- ================= SUBTLE, NON-INTRUSIVE TOAST CONTAINER ================= -->
  <div id="toast-container" class="toast-container"></div>

  <!-- Application Logic -->
  <script src="/app.js"></script>
</body>
</html>
